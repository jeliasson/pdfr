[package]
name = "pdfr-ocr"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
pdfr-core = { path = "../core" }
# Pure-Rust OCR: text detection and recognition models run by rten.
ocrs = { version = "0.14", default-features = false, features = ["onnx"] }
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
sha2 = "0.10"

[dev-dependencies]
pdfr-assist = { path = "../assist" }
pdfr-license = { path = "../license" }
