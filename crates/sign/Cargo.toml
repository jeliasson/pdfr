[package]
name = "pdfr-sign"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# PKCS#11 (NSS database, smartcards): pure-Rust bindings; the module itself
# is loaded at run time from the system, nothing is linked.
cryptoki = "0.10"
cryptoki-sys = "0.4"
pdfr-core = { path = "../core" }
lopdf = "0.47"
# CMS / X.509 / signatures: RustCrypto, pure Rust (the family already in
# the build through rustls-rustcrypto and ed25519-dalek).
cms = "0.2"
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std", "oid", "alloc"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
sha1 = { version = "0.10", features = ["oid"] }
x509-tsp = "0.1"
cmpv2 = { version = "0.2", features = ["alloc"] }
base64 = "0.23"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der", "verifying"] }
signature = "2"
pkcs8 = "0.10"
p12-keystore = "0.2"
zeroize = "1"
getrandom = "0.3"

# macOS: signing with Keychain identities (Apple's Security.framework).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[dev-dependencies]
lopdf = "0.47"
x509-cert = { version = "0.2", features = ["std", "builder"] }
rand_core = { version = "0.6", features = ["getrandom"] }
