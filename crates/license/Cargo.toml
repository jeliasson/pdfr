[package]
name = "pdfr-license"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "pdfr licence keys: offline verification of Ed25519-signed keys"

[dependencies]
# Pure Rust: no C code.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dirs = "6"
