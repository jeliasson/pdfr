[workspace]
resolver = "3"
members = ["crates/core", "crates/assist", "crates/license", "crates/app"]

[workspace.package]
version = "0.3.0-rc1"
edition = "2024"
license-file = "LICENSE.md"
publish = false
repository = "https://github.com/kjellberg/pdfr"
rust-version = "1.92"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# Detection and text extraction run on the render thread; unoptimised they
# hold up page renders long enough to show blank pages while scrolling.
[profile.dev.package.pdfr-core]
opt-level = 2
