# Keeps the README's Sponsors section in step with pdfr.app/sponsors:
# weekly, and on demand. Commits to main only when the list changed.
name: Sponsors

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rewrite the Sponsors section
        run: |
          curl -fsSL https://pdfr.app/api/sponsors.json -o sponsors.json
          python3 - <<'EOF'
          import html, json, re
          sponsors = json.load(open("sponsors.json"))["sponsors"]
          def esc(s):
              return re.sub(r"([\[\]<>*_`|\\])", r"\\\1", s)
          def ok(u):
              # https only, and nothing that could end the link or the tag.
              return (isinstance(u, str) and u.startswith("https://")
                      and not re.search(r"[\s\"'<>\\`]", u))
          def link(u):
              # A ")" or "(" would end or break a Markdown link.
              return u.replace("(", "%28").replace(")", "%29")
          logos, names = [], []
          for f in sponsors:
              url = f.get("url") if ok(f.get("url")) else None
              if ok(f.get("logo")):
                  img = f'<img src="{html.escape(f["logo"])}" alt="{html.escape(f["name"])}" height="28">'
                  logos.append(f'<a href="{html.escape(url)}">{img}</a>' if url else img)
              else:
                  entry = f"[{esc(f['name'])}]({link(url)})" if url else esc(f["name"])
                  if f.get("blurb"):
                      entry += f": {esc(f['blurb'])}"
                  names.append(f"- {entry}")
          parts = []
          if logos:
              parts.append("<p>\n" + "&nbsp;&nbsp;&nbsp;\n".join(logos) + "\n</p>")
          if names:
              parts.append("\n".join(names))
          if sponsors:
              parts.append("*[Become a Sponsor](https://pdfr.app/buy/sponsor).*")
          else:
              parts.append("*Be the first: [become a Sponsor](https://pdfr.app/buy/sponsor).*")
          body = "\n\n".join(parts)
          readme = open("README.md").read()
          new = re.sub(r"(<!-- sponsors:start -->\n).*?(\n<!-- sponsors:end -->)",
                       lambda m: m.group(1) + body + m.group(2), readme, flags=re.S)
          open("README.md", "w").write(new)
          EOF
          rm sponsors.json
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: update the Sponsors"
          git push origin HEAD:main
