name: CI

# Changes to documentation only (README, docs, screenshots) don't need a
# build: those paths are ignored. Anything else runs everything.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        # UI tests run headless (egui_kittest); no display needed.
        run: cargo test --locked --release

  # The third-party notices shipped with every package must match Cargo.lock.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Notices are up to date
        run: |
          tools/notices.sh
          git diff --exit-code assets/THIRD-PARTY-NOTICES.txt || {
            echo "::error::assets/THIRD-PARTY-NOTICES.txt is out of date: run tools/notices.sh and commit it."
            exit 1
          }

  # The Linux packages, installed and started on several distributions.
  linux:
    name: Linux packages
    uses: ./.github/workflows/build-linux.yml
    with:
      version: dev
