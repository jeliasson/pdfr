name: CI

# Changes to documentation only (README, docs, screenshots) don't need a
# build: those paths are ignored. Anything else runs everything.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        # UI tests run headless (egui_kittest); no display needed.
        run: cargo test --locked --release

  # The third-party notices shipped with every package must match Cargo.lock.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about@0.9.3
      - name: Notices are up to date
        run: |
          tools/notices.sh
          git diff --exit-code assets/THIRD-PARTY-NOTICES.txt || {
            echo "::error::assets/THIRD-PARTY-NOTICES.txt is out of date: run tools/notices.sh and commit it."
            exit 1
          }

  # Known vulnerabilities in the crates pdfr uses (RustSec). Exceptions,
  # each with its reason, are in deny.toml.
  advisories:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      - run: cargo deny --locked check advisories

  installer:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh packaging/install.sh

  # The Linux packages, installed and started on several distributions.
  linux:
    name: Linux packages
    uses: ./.github/workflows/build-linux.yml
    with:
      version: dev
