# Runs when a version tag is pushed (tools/release.sh makes one):
#   1. builds and tries the Linux packages (build-linux.yml)
#   2. publishes a GitHub release with them, the macOS app, install.sh (the
#      installer pdfr.app serves), SHA256SUMS and the changelog
#   3. signs SHA256SUMS (SHA256SUMS.sig) in the `sign` job, with the secret
#      RELEASE_SIGNING_KEY of the protected `release` environment
#   4. runs the released installer on Linux and macOS
#   5. for stable versions, and only while the variable PUBLISH_PACKAGES is
#      true, updates the AUR, the Homebrew tap and the apt/rpm repositories.
#      Each of those is also skipped while its secret is missing; see
#      docs/RELEASING.md.
# Tags with a "-" (v0.2.0-rc1) make a pre-release and publish nowhere else.
# macOS and Windows builds are switched on with the repository variables
# RELEASE_MACOS / RELEASE_WINDOWS once they are tested.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        # The version goes into file names, addresses and scripts: only
        # vX.Y.Z with an optional suffix of letters, digits and dots (the
        # same rule as tools/release.sh). Later jobs read it through env.
        run: |
          if ! [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag is not a version (vX.Y.Z or vX.Y.Z-rc1)"; exit 1
          fi
          v=${GITHUB_REF_NAME#v}
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${v%%-*}" != "${cargo_v%%-*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  linux:
    name: Linux packages
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    name: macOS app
    needs: version
    if: vars.RELEASE_MACOS == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  windows:
    name: Windows installer
    needs: version
    if: vars.RELEASE_WINDOWS == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked --release -p pdfr
      - name: Build the installer
        shell: pwsh
        env:
          V: ${{ needs.version.outputs.version }}
        run: packaging/windows/build-msi.ps1 -Version "$env:V" -Out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  release:
    name: GitHub release
    needs: [version, linux, macos, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.macos.result != 'failure' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: "{linux-*,macos,windows}"
          merge-multiple: true
      - name: Checksums and notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          v=$V
          # The installer pdfr.app serves, with this version stamped in.
          sed "s/^VERSION=\"@VERSION@\"$/VERSION=\"$v\"/" packaging/install.sh > artifacts/install.sh
          grep -q "^VERSION=\"$v\"$" artifacts/install.sh
          cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          awk -v v="${v%%-*}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "pdfr $v" > notes.md
          cat >> notes.md <<'MD'

          ### Install or update

          On Linux and macOS:

          ```sh
          curl -fsSL https://pdfr.app/install.sh | sh
          ```

          Or download a file below: the `.dmg` for macOS, the `.tar.gz` for any Linux
          (`./pdfr --register` adds it to your app menu), or the `.deb` / `.rpm`.
          MD
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  # Signs SHA256SUMS with the release key, so pdfr's "Update now" and
  # install.sh can tell the files came from here. The key is a secret of the
  # protected `release` environment, and this job runs nothing but checkout,
  # our own code and gh: no third-party action sees it. Before signing it
  # checks that the release's files are exactly what this run built.
  sign:
    name: Sign the checksums
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the signing tool
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release -p pdfr-license --bin release_sign
      - name: Check the release against this run's builds
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release built
          gh release download "v$V" -R "$GITHUB_REPOSITORY" -D release
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -D built -p 'linux-*' -p macos -p windows
          sed "s/^VERSION=\"@VERSION@\"$/VERSION=\"$V\"/" packaging/install.sh > built/install.sh
          (cd release && sha256sum -c SHA256SUMS)
          # Every file the release lists, and nothing else, is one built here.
          find built -type f -exec sha256sum {} + | sed 's|  .*/|  |' | sort -k2 > built.sums
          sort -k2 release/SHA256SUMS | diff - built.sums
          find release -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig -printf '%f\n' | sort \
            | diff - <(awk '{print $2}' built.sums | sort)
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          target/release/release_sign sign release/SHA256SUMS
          target/release/release_sign verify release/SHA256SUMS
      - name: Upload SHA256SUMS.sig
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: gh release upload "v$V" -R "$GITHUB_REPOSITORY" release/SHA256SUMS.sig --clobber

  # The released installer, run the way users run it: install, run again
  # (up to date), uninstall. On Linux it must check the signature.
  installer:
    name: Try the installer (${{ matrix.os }})
    needs: [version, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install, update, uninstall
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/install.sh" -o install.sh
          sh install.sh 2>&1 | tee first.txt
          if [ "$RUNNER_OS" = Linux ] && grep -q "checking checksums only" first.txt; then
            echo "::error::install.sh did not check the release's signature"; exit 1
          fi
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          pdfr --version
          sh install.sh | tee second.txt
          if [ "$V" = "${V%%-*}" ]; then grep -q "up to date" second.txt; fi
          sh install.sh --uninstall
          hash -r; ! command -v pdfr

  aur:
    name: Publish to the AUR
    needs: [version, sign]
    if: needs.version.outputs.prerelease == 'false' && vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [pdfr, pdfr-bin]
    env:
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
      - name: Update the PKGBUILD
        if: env.HAS_KEY == 'true'
        run: |
          v=$V
          base=https://github.com/kjellberg/pdfr
          dir=packaging/aur; [ "${{ matrix.pkg }}" = pdfr-bin ] && dir=packaging/aur/pdfr-bin
          sed -i "s/^pkgver=.*/pkgver=$v/; s/^pkgrel=.*/pkgrel=1/" $dir/PKGBUILD
          sum() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }
          if [ "${{ matrix.pkg }}" = pdfr ]; then
            sed -i "s/^sha256sums=.*/sha256sums=('$(sum $base/archive/refs/tags/v$v.tar.gz)')/" $dir/PKGBUILD
          else
            sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$(sum $base/releases/download/v$v/pdfr-v$v-x86_64-linux.tar.gz)')/" $dir/PKGBUILD
            sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$(sum $base/releases/download/v$v/pdfr-v$v-aarch64-linux.tar.gz)')/" $dir/PKGBUILD
          fi
          cp $dir/PKGBUILD ./PKGBUILD.out
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.HAS_KEY == 'true'
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ./PKGBUILD.out
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: pdfr ${{ needs.version.outputs.version }}

  homebrew:
    name: Update the Homebrew tap
    needs: [version, sign]
    if: needs.version.outputs.prerelease == 'false' && vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TAP_DEPLOY_KEY != '' }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          repository: kjellberg/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Bump the formula
        if: env.HAS_KEY == 'true'
        run: |
          v=$V
          url=https://github.com/kjellberg/pdfr/archive/refs/tags/v$v.tar.gz
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          mkdir -p tap/Formula
          sed -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            packaging/homebrew/pdfr.rb > tap/Formula/pdfr.rb
          cd tap
          git config user.name "pdfr release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/pdfr.rb
          git commit -m "pdfr $v" && git push || echo "nothing to update"

  repos:
    name: Update the apt and rpm repositories
    needs: [version, sign]
    if: needs.version.outputs.prerelease == 'false' && vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY != '' && secrets.PACKAGES_DEPLOY_KEY != '' }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          repository: kjellberg/packages
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_KEY == 'true'
        with:
          path: new
          pattern: linux-*
          merge-multiple: true
      - name: Rebuild and sign the repositories
        if: env.HAS_KEY == 'true'
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm gnupg
          echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          export GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          tools/publish_repos.sh site new
          cd site
          git config user.name "pdfr release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "pdfr $V" && git push

  flatpak:
    name: Flatpak bundle (check)
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Crate list for the offline build
        run: |
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          pip3 install --break-system-packages aiohttp toml tomlkit 2>/dev/null || pip3 install aiohttp toml tomlkit
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          bundle: pdfr.flatpak
          manifest-path: packaging/flatpak/io.github.kjellberg.pdfr.yml
          cache-key: flatpak-${{ github.sha }}
