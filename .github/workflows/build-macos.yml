name: macOS app

# pdfr.app (Apple silicon and Intel in one), as a .zip and a .dmg. Called by
# release.yml; also runnable by hand to try the macOS build without a release:
#   gh workflow run build-macos.yml -f version=0.0.0-test
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the app
        default: 0.0.0-test

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build pdfr.app and the disk image
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          V: ${{ inputs.version }}
        run: packaging/macos/make_app.sh "$V" dist
      - name: Try it
        env:
          V: ${{ inputs.version }}
        # Mount the disk image, check the app is universal and signed, and
        # start it far enough to print its version.
        run: |
          set -euo pipefail
          v=$V
          # Our own mount point: hdiutil's printed table changes between
          # macOS versions.
          mnt=$(mktemp -d)
          hdiutil attach "dist/pdfr-v$v-macos.dmg" -nobrowse -mountpoint "$mnt"
          app="$mnt/pdfr.app"
          lipo -archs "$app/Contents/MacOS/pdfr"
          lipo -archs "$app/Contents/MacOS/pdfr" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/pdfr" | grep -q x86_64
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          "$app/Contents/MacOS/pdfr" --version
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*
